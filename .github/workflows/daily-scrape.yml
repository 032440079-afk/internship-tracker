name: Daily Internship Scrape
permissions:
  contents: write
on:
  schedule:
    # GitHub zamanlanmis isleri bu repoda her gun 4-7 saat gecikmeli baslatiyor (06:00 -> 11:48-13:40 UTC,
    # 02:17 -> 06:35'ten sonra). Bu yuzden aksam saatine kuruldu: UTC 21:17 = Turkiye saatiyle 00:17.
    # Gecikmezse gece calisir, her zamanki kadar gecikirse sabah 04:00-07:30 arasi biter.
    - cron: "17 21 * * *"
  workflow_dispatch: {}   # Actions sekmesinden manuel de tetiklenebilir

# Ayni anda iki calisma olmasin (ornegin zamanlanmis + elle baslatilan): ikincisi birincinin bitmesini bekler,
# boylece ayni ilan iki kez bildirilmez.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # ubuntu-latest 2026-10'da Ubuntu 26.04'e gecti; Playwright 1.55 o surumde Chromium kuramiyor ("does not support
    # chromium on ubuntu26.04-x64"). Playwright guncellenene kadar 24.04'e sabit.
    runs-on: ubuntu-24.04
    env:
      CV_KEY: ${{ secrets.CV_KEY }}   # sifreli ana CV'leri acmak icin; bos ise CV uretimi kapali
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Playwright tarayıcısını kur
        run: python -m playwright install --with-deps chromium

      # Uyarlanmis CV / on yazi icin: PDF'e cevirmek uzere LibreOffice ve sifreli ana CV'nin acilmasi.
      # CV_KEY secret'i yoksa bu adimlar atlanir ve run.py CV uretimini kapali calistirir.
      - name: CV araclarını kur
        if: ${{ env.CV_KEY != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
          # cv/master_cv.docx.enc -> /tmp/master_cv.docx (Kaan), cv/cv_2.docx.enc -> /tmp/cv_2.docx (2. kisi)
          for f in cv/*.docx.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$f" -out "/tmp/$(basename "$f" .enc)" -pass env:CV_KEY
          done

      - name: Scraper'ları çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CV_CHAT_IDS: ${{ secrets.TELEGRAM_CV_CHAT_IDS }}
          APPLICANT_NOTE: ${{ secrets.APPLICANT_NOTE }}   # istege bagli: on yazi icin Kaan'in kendi kisa notu
          APPLICANT_NOTE_2: ${{ secrets.APPLICANT_NOTE_2 }}   # istege bagli: 2. kisinin kendi kisa notu
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}   # siteye girebilecek Google hesaplari, virgulle; ilki Kaan, ikincisi cv_2
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                 # istege bagli: CV / on yazi PDF'lerinin
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}   # gizli deposu (panodaki indirme linkleri)
          PYTHONUNBUFFERED: "1"   # log satirlari aninda yazilsin (zaman damgalari dogru olsun)
        run: python run.py

      - name: Dashboard commit et
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Calisma surerken main'e yeni commit gelmis olabilir: sadece dashboard'u en guncel main'in ustune koy
          git fetch -q origin main
          git reset -q origin/main
          git add docs/index.html
          git diff --staged --quiet || (git commit -m "Update dashboard" && git push origin HEAD:main)

      # Hata verirse calisma kirmizi gorunsun (dashboard zaten bir onceki adimda commit edildi)
      - name: Firebase Hosting'e deploy et
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          PROJECT_ID=$(python3 -c "import json;print(json.load(open('/tmp/firebase-sa.json'))['project_id'])")
          # firebase-tools 15.34.1+ deploy'dan once Service Usage API'ye soruyor: servis hesabinda
          # "Service Usage Consumer" rolu olmali, yoksa HTTP 403 (bkz. SETUP.md)
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
          # Not: firestore.rules buradan yuklenmiyor (servis hesabinin yetkisi yok); Firebase Console'dan
          # bir kez elle yayinlanir, bkz. SETUP.md

name: Daily Internship Scrape
permissions:
  contents: write
on:
  schedule:
    # Her gün UTC 06:00 = Türkiye saatiyle yaz saatinde 09:00 civarı
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # Actions sekmesinden manuel de tetiklenebilir

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Scraper'ları çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Dashboard commit et
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || (git commit -m "Update dashboard" && git push)

      - name: Firebase Hosting'e deploy et
        if: success()
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          PROJECT_ID=$(python3 -c "import json;print(json.load(open('/tmp/firebase-sa.json'))['project_id'])")
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive

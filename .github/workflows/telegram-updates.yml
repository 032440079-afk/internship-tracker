name: Telegram basvuru takibi
permissions:
  contents: read
on:
  schedule:
    # Saatte bir: ilan bildirimlerindeki "Basvurdum / Gorusme / Red / Kabul" butonlarini ve /ozet komutunu isler
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-updates
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -q firebase-admin==7.5.0 python-telegram-bot==22.8
      - name: Telegram güncellemelerini işle
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CV_CHAT_IDS: ${{ secrets.TELEGRAM_CV_CHAT_IDS }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: python track.py

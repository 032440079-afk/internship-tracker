# GECICI: yeni sirket kaynaklarini merge oncesi kontrol eder. Merge'den once silinecek.
name: Check new sources
on:
  push:
    branches: ["claude/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Yeni kaynaklari dene
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/check_new_sources.py
